<template id="evidenceRepositoryTemplate">
    <section class="evidence-module" id="evidenceRepositoryApp">

        <div class="ev-header">
            <div>
                <h2>Evidence Repository</h2>
                <p>Manage supporting documents linked to investigation cases and regulatory exceptions.</p>
            </div>

            <button class="ev-primary-btn" id="evAddDocumentBtn">
                + Add Evidence
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="ev-metrics">
            <div class="ev-metric-card">
                <span>Total Documents</span>
                <strong id="evTotalCount">0</strong>
            </div>

            <div class="ev-metric-card">
                <span>Verified</span>
                <strong id="evVerifiedCount">0</strong>
            </div>

            <div class="ev-metric-card">
                <span>Pending</span>
                <strong id="evPendingCount">0</strong>
            </div>

            <div class="ev-metric-card">
                <span>Rejected</span>
                <strong id="evRejectedCount">0</strong>
            </div>

            <div class="ev-metric-card">
                <span>Investigation Cases</span>
                <strong id="evCasesCount">0</strong>
            </div>

            <div class="ev-metric-card">
                <span>Related Exceptions</span>
                <strong id="evExceptionsCount">0</strong>
            </div>
        </div>

        <!-- Document Repository -->
        <div class="ev-section">
            <div class="ev-toolbar">
                <h3>Document Repository</h3>

                <div class="ev-filters">
                    <input
                        type="search"
                        id="evSearch"
                        placeholder="Search documents..."
                    >

                    <select id="evStatusFilter">
                        <option value="ALL">All Status</option>
                        <option value="PENDING">Pending</option>
                        <option value="VERIFIED">Verified</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>
            </div>

            <div class="ev-table-wrap">
                <table class="ev-table">
                    <thead>
                        <tr>
                            <th>Document ID</th>
                            <th>Case ID</th>
                            <th>Exception ID</th>
                            <th>Document Name</th>
                            <th>Document Type</th>
                            <th>Description</th>
                            <th>Uploaded By</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="evTableBody">
                        <tr>
                            <td colspan="9" class="ev-empty">
                                No documents have been added yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Evidence Modal -->
        <div class="ev-modal" id="evAddModal">
            <div class="ev-modal-card">
                <div class="ev-modal-header">
                    <h3>Add Evidence Document</h3>
                    <button class="ev-close-btn" id="evAddClose" type="button">
                        &times;
                    </button>
                </div>

                <div class="ev-form-group">
                    <label for="evCaseSelect">Investigation Case</label>
                    <select id="evCaseSelect">
                        <option value="">Select Investigation Case</option>
                    </select>
                </div>

                <div class="ev-form-group">
                    <label for="evFileInput">Choose Document</label>
                    <input
                        type="file"
                        id="evFileInput"
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg"
                    >
                    <small class="ev-form-note">
                        Demo mode stores the filename and metadata only. File contents are not uploaded.
                    </small>
                </div>

                <div class="ev-form-group">
                    <label for="evDocumentType">Document Type</label>
                    <select id="evDocumentType">
                        <option value="">Select Document Type</option>
                        <option value="Calculation Sheet">Calculation Sheet</option>
                        <option value="Transaction Report">Transaction Report</option>
                        <option value="Risk Assessment">Risk Assessment</option>
                        <option value="Reconciliation Statement">Reconciliation Statement</option>
                        <option value="Supporting Document">Supporting Document</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="ev-form-group">
                    <label for="evDescription">Description</label>
                    <textarea
                        id="evDescription"
                        placeholder="Explain why this document is relevant to the investigation..."
                    ></textarea>
                </div>

                <div class="ev-modal-actions">
                    <button class="ev-secondary-btn" id="evAddCancel" type="button">
                        Cancel
                    </button>

                    <button class="ev-primary-btn" id="evSaveDocument" type="button">
                        Add Document
                    </button>
                </div>
            </div>
        </div>

        <!-- Document Details Modal -->
        <div class="ev-modal" id="evDetailsModal">
            <div class="ev-modal-card">
                <div class="ev-modal-header">
                    <h3>Document Details</h3>
                    <button class="ev-close-btn" id="evDetailsClose" type="button">
                        &times;
                    </button>
                </div>

                <div id="evDetailsContent"></div>

                <div class="ev-modal-actions">
                    <button class="ev-secondary-btn" id="evDetailsDone" type="button">
                        Close
                    </button>
                </div>
            </div>
        </div>

        <div class="ev-toast" id="evToast"></div>

    </section>
        </template>

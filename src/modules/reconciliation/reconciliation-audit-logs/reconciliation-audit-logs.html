<template id="reconciliationAuditLogsTemplate">
    <section class="ral-module" id="reconciliationAuditLogsApp">

        <div class="ral-header">
            <div>
                <h2>Reconciliation Audit Logs</h2>
                <p>
                    Centralized activity history for the reconciliation
                    and approval workflow.
                </p>
            </div>

            <div class="ral-actions">
                <button class="ral-btn" id="ralExportCsvBtn">
                    Export CSV
                </button>

                <button class="ral-btn" id="ralExportJsonBtn">
                    Export JSON
                </button>

                <button class="ral-btn ral-btn-primary" id="ralPrintBtn">
                    Print
                </button>
            </div>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="ral-metrics">

            <div class="ral-metric-card">
                <div class="ral-metric-label">Total Events</div>
                <div class="ral-metric-value" id="ralTotalCount">0</div>
            </div>

            <div class="ral-metric-card">
                <div class="ral-metric-label">Visible Events</div>
                <div class="ral-metric-value" id="ralVisibleCount">0</div>
            </div>

            <div class="ral-metric-card success">
                <div class="ral-metric-label">Success</div>
                <div class="ral-metric-value" id="ralSuccessCount">0</div>
            </div>

            <div class="ral-metric-card warning">
                <div class="ral-metric-label">Warnings</div>
                <div class="ral-metric-value" id="ralWarningCount">0</div>
            </div>

            <div class="ral-metric-card error">
                <div class="ral-metric-label">Errors</div>
                <div class="ral-metric-value" id="ralErrorCount">0</div>
            </div>

            <div class="ral-metric-card security">
                <div class="ral-metric-label">Security Events</div>
                <div class="ral-metric-value" id="ralSecurityCount">0</div>
            </div>

        </div>

        <!-- AUDIT LOG TABLE -->
        <div class="ral-panel">

            <div class="ral-panel-header">
                <h3>Audit Event Register</h3>
                <p>
                    Search, filter and review recorded system activities.
                </p>
            </div>

            <!-- FILTERS -->
            <div class="ral-filters">

                <div class="ral-filter-group">
                    <label for="ralSearch">Search Audit Events</label>
                    <input
                        type="text"
                        id="ralSearch"
                        placeholder="Search ID, user, action, reference..."
                    >
                </div>

                <div class="ral-filter-group">
                    <label for="ralModuleFilter">Module</label>
                    <select id="ralModuleFilter">
                        <option value="ALL">All Modules</option>
                        <option value="RECONCILIATION">Reconciliation</option>
                        <option value="Variance Analysis">Variance Analysis</option>
                        <option value="Exception Management">Exception Management</option>
                        <option value="Investigation">Investigation</option>
                        <option value="Evidence Repository">Evidence Repository</option>
                        <option value="Approval & Closure">Approval &amp; Closure</option>
                    </select>
                </div>

                <div class="ral-filter-group">
                    <label for="ralTypeFilter">Event Type</label>
                    <select id="ralTypeFilter">
                        <option value="ALL">All Types</option>
                        <option value="INFO">Info</option>
                        <option value="SUCCESS">Success</option>
                        <option value="WARNING">Warning</option>
                        <option value="ERROR">Error</option>
                        <option value="SECURITY">Security</option>
                    </select>
                </div>

            </div>

            <!-- TABLE -->
            <div class="ral-table-wrap">
                <table class="ral-table">
                    <thead>
                        <tr>
                            <th>Audit ID</th>
                            <th>Timestamp</th>
                            <th>Module</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Reference</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>

                    <tbody id="ralTableBody">
                        <tr>
                            <td colspan="9" class="ral-empty">
                                Loading audit events...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="ral-footer">
                <span>
                    Showing <strong id="ralFooterVisible">0</strong>
                    of <strong id="ralFooterTotal">0</strong> events
                </span>

                <span>
                    Source: Reconciliation Workflow Audit Records
                </span>
            </div>

        </div>

    </section>
        </template>

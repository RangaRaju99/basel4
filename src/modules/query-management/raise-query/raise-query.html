<template id="raiseQueryTemplate">

    <section class="rq-module" id="raiseQueryApp">

        <!-- HEADER -->
        <header class="rq-header">
            <div class="rq-header-content">
                <span class="rq-eyebrow">QUERY MANAGEMENT</span>
                <h2>Raise Query</h2>
                <p>Create a query related to a regulatory report and assign it to the responsible team.</p>
            </div>

            <div class="rq-header-icon">
                <i class="fa-solid fa-circle-question"></i>
            </div>
        </header>

        <!-- BREADCRUMB -->
        <nav class="rq-breadcrumb" aria-label="Breadcrumb">
            <span>Workspace</span>
            <span>/</span>
            <span>Query Management</span>
            <span>/</span>
            <strong>Raise Query</strong>
        </nav>

        <div class="rq-layout">

            <!-- QUERY FORM -->
            <div class="rq-card">

                <div class="rq-card-heading">
                    <div class="rq-card-heading-icon">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </div>

                    <div>
                        <h3>Query Information</h3>
                        <p>Enter the details below to create a new query.</p>
                    </div>
                </div>

                <form id="rqForm">

                    <div class="rq-form-grid">

                        <!-- QUERY ID -->
                        <div class="rq-field">
                            <label for="rqQueryId">
                                Query ID
                            </label>

                            <input
                                type="text"
                                id="rqQueryId"
                                readonly
                            >

                            <small class="rq-field-hint">
                                Automatically generated by the system.
                            </small>
                        </div>

                        <!-- REPORT NAME -->
                        <div class="rq-field">
                            <label for="rqReportName">
                                Report Name <span class="rq-required">*</span>
                            </label>

                            <select id="rqReportName" required>
                                <option value="">Select a report</option>
                            </select>
                        </div>

                        <!-- RAISED BY -->
                        <div class="rq-field">
                            <label for="rqRaisedBy">
                                Raised By
                            </label>

                            <input
                                type="text"
                                id="rqRaisedBy"
                                readonly
                            >
                        </div>

                        <!-- DATE -->
                        <div class="rq-field">
                            <label for="rqDate">
                                Date
                            </label>

                            <input
                                type="date"
                                id="rqDate"
                                readonly
                            >
                        </div>

                        <!-- PRIORITY -->
                        <div class="rq-field full">
                            <label>
                                Priority <span class="rq-required">*</span>
                            </label>

                            <div class="rq-priority-options">

                                <label class="rq-priority-option high">
                                    <input
                                        type="radio"
                                        name="rqPriority"
                                        value="High"
                                        required
                                    >
                                    <span>High</span>
                                </label>

                                <label class="rq-priority-option medium">
                                    <input
                                        type="radio"
                                        name="rqPriority"
                                        value="Medium"
                                        checked
                                    >
                                    <span>Medium</span>
                                </label>

                                <label class="rq-priority-option low">
                                    <input
                                        type="radio"
                                        name="rqPriority"
                                        value="Low"
                                    >
                                    <span>Low</span>
                                </label>

                            </div>
                        </div>

                        <!-- ASSIGNED TO -->
                        <div class="rq-field full">
                            <label for="rqAssignedTo">
                                Assigned To <span class="rq-required">*</span>
                            </label>

                            <select id="rqAssignedTo" required>
                                <option value="">Select a team</option>
                            </select>

                            <small class="rq-field-hint">
                                Select the team responsible for resolving this query.
                            </small>
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="rq-field full">
                            <label for="rqDescription">
                                Query Description <span class="rq-required">*</span>
                            </label>

                            <textarea
                                id="rqDescription"
                                placeholder="Describe the issue, report discrepancy, clarification required, or supporting details..."
                                maxlength="1000"
                                required
                            ></textarea>

                            <small class="rq-field-hint">
                                Provide enough information for the assigned team to understand and investigate the query.
                            </small>
                        </div>

                    </div>

                    <!-- FORM ACTIONS -->
                    <div class="rq-form-actions">

                        <button
                            type="button"
                            class="rq-btn rq-btn-secondary"
                            id="rqResetButton"
                        >
                            Reset
                        </button>

                        <button
                            type="submit"
                            class="rq-btn rq-btn-primary"
                        >
                            <i class="fa-solid fa-plus"></i>
                            Create Query
                        </button>

                    </div>

                </form>

            </div>

            <!-- RIGHT SIDE INFORMATION -->
            <aside class="rq-side-column">

                <div class="rq-side-card">

                    <h3>Query Workflow</h3>

                    <div class="rq-process-list">

                        <div class="rq-process-item">
                            <span class="rq-process-number">1</span>
                            <div>
                                <strong>Raise Query</strong>
                                <small>Enter report details and describe the issue.</small>
                            </div>
                        </div>

                        <div class="rq-process-item">
                            <span class="rq-process-number">2</span>
                            <div>
                                <strong>Assign Query</strong>
                                <small>Choose the responsible team for investigation.</small>
                            </div>
                        </div>

                        <div class="rq-process-item">
                            <span class="rq-process-number">3</span>
                            <div>
                                <strong>Track Progress</strong>
                                <small>The assigned team can update the query status.</small>
                            </div>
                        </div>

                        <div class="rq-process-item">
                            <span class="rq-process-number">4</span>
                            <div>
                                <strong>Close Query</strong>
                                <small>Close the query after the issue is resolved.</small>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="rq-side-card">

                    <h3>Important Information</h3>

                    <div class="rq-info-note">
                        <strong><i class="fa-solid fa-circle-info"></i> Please note</strong>

                        Each query receives a unique Query ID. The query details are saved in the browser and can be accessed by the connected Manage Query module.
                    </div>

                </div>

            </aside>

        </div>

        <!-- TOAST -->
        <div class="rq-toast" id="rqToast" role="status"></div>

    </section>

        </template>
